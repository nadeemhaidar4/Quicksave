<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6cfc"/>
      <stop offset="100%" stop-color="#e83e8c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="10"
                    flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Top shine -->
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>

  <!-- Inner border -->
  <rect x="6" y="6" width="500" height="500" rx="108"
        fill="none"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="2"/>

  <!-- "Quick" text -->
  <text
    x="256" y="218"
    font-family="'Arial Black','Arial Bold',Impact,Gadget,sans-serif"
    font-size="132"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-4"
    filter="url(#sh)"
  >Quick</text>

  <!-- Divider -->
  <rect x="72" y="272" width="368" height="3" rx="1.5"
        fill="rgba(255,255,255,0.20)"/>

  <!-- "Save" text - light purple -->
  <text
    x="256" y="358"
    font-family="'Arial Black','Arial Bold',Impact,Gadget,sans-serif"
    font-size="132"
    font-weight="900"
    fill="#ddd0ff"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-4"
    filter="url(#sh)"
  >Save</text>

</svg>
